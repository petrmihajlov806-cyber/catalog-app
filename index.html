<style>
/* Layout: mobile-first Telegram Mini App — sticky header with search + category rail, 2-col product grid, bottom cart bar, slide-up sheets */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --fg:#1d1a17; --muted:#77706a; --line:#e7e2dc;
  --accent:#e8712a; --accent-ink:#ffffff; --accent-soft:#fdebdf;
  --ok:#2f8a4e; --warn:#b7791f; --bad:#b4413a; --chip:#efebe6;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1f1c19; --fg:#f3efea; --muted:#a39a91; --line:#34302b;
  --accent:#f08543; --accent-ink:#1a1009; --accent-soft:#3a2617;
  --ok:#5cbf7d; --warn:#e0a84a; --bad:#e2766e; --chip:#2a2622; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1f1c19; --fg:#f3efea; --muted:#a39a91; --line:#34302b;
  --accent:#f08543; --accent-ink:#1a1009; --accent-soft:#3a2617;
  --ok:#5cbf7d; --warn:#e0a84a; --bad:#e2766e; --chip:#2a2622; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.search{flex:1;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;outline:none}
.search input:focus{border-color:var(--accent)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tier{display:grid;gap:6px;padding-block:12px;font-size:13px}
.tier-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tier b{font-weight:700}
.track{position:relative;height:6px;border-radius:6px;background:var(--chip);overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px;transition:width .3s}
.marks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
h2.sec{font-family:var(--f-display);font-weight:500;font-size:15px;margin:22px 0 10px;text-wrap:balance}
.note{font-size:13px;color:var(--muted);margin:-4px 0 12px;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;background:#fff;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:contain;padding:8px}
.ph .ph-empty{font-family:var(--f-display);font-size:13px;color:#a6998c;text-align:center;padding:12px;line-height:1.3}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.badge.order{background:var(--warn);color:#fff}
.badge.out{background:#6f6862;color:#fff}
.body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;font-size:13.5px;line-height:1.3}
.price{font-variant-numeric:tabular-nums}
.price strong{font-family:var(--f-display);font-weight:700;font-size:16px}
.price span{color:var(--muted);font-size:12px}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ladder{display:flex;gap:4px;font-size:11px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.ladder span{padding:2px 6px;border-radius:5px;background:var(--chip);color:var(--muted)}
.ladder span.on{background:var(--accent-soft);color:var(--fg);font-weight:700}
.act{margin-top:auto;padding-top:4px}
.add{width:100%;border:0;border-radius:10px;padding:9px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.add:disabled{background:var(--chip);color:var(--muted);cursor:default}
.step{display:flex;align-items:center;justify-content:space-between;border-radius:10px;background:var(--accent-soft)}
.step button{border:0;background:none;width:38px;height:38px;font-size:20px;font-weight:700;color:var(--accent)}
.qwrap{display:flex;align-items:baseline;justify-content:center;gap:3px;font-weight:700;font-size:13px;cursor:text}
.qin{width:56px;border:1px solid transparent;border-radius:6px;background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;text-align:center;padding:4px 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qin:focus{border-color:var(--accent);outline:none}
.qin::-webkit-inner-spin-button,.qin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.step output{font-weight:700;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.brandcard{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;margin-top:12px}
.brandcard table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.brandcard td,.brandcard th{padding:4px 10px 4px 0;text-align:left}
.brandcard th{color:var(--muted);font-weight:600}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px 0}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.bar .sum strong{display:block;font-family:var(--f-display);font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--chip);border-radius:999px;width:32px;height:32px;font-size:16px}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.line img,.line .mini{width:48px;height:48px;border-radius:8px;object-fit:contain;background:#fff}
.line .t{min-width:0;font-size:13px}
.line .t b{display:block;font-weight:600}
.line .t span{color:var(--muted);font-variant-numeric:tabular-nums}
.line .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;display:grid;gap:4px;justify-items:end}
.line .step{width:128px}
.line .qin{width:42px;font-size:13px}
.line .qwrap{gap:2px}
.line .step button{width:32px;height:30px;font-size:17px}
.totals{display:grid;gap:4px;padding-block:12px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .grand{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:4px}
.hint{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;max-width:65ch}
form{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:13px;font-weight:600}
input[type=text],input[type=tel],textarea,select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:500;width:100%}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;font-weight:500;background:var(--chip);border-radius:999px;padding:7px 12px;cursor:pointer}
.seg input{accent-color:var(--accent);margin:0}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.preview{background:var(--bg);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.45;font-family:var(--f-body);overflow-wrap:anywhere}
.demo{font-size:12px;color:var(--muted);margin-top:8px}
.foot{font-size:12px;color:var(--muted);padding-block:26px 8px;display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const DEMO = false;
const CATS = [
  ["cups","Стаканы"],["lids","Крышки"],["straws","Трубочки"],["cutlery","Приборы"],
  ["tapioca","Тапиока"],["syrups","Сиропы"],["juiceballs","Джус боллы"],["jelly","Желе"],
  ["powders","Порошки"],["mixes","Сухие смеси"],["waffles","Смеси для вафель"],["tea","Чай"],["equipment","Оборудование"]
];
const TIERS=[0,30000,100000];
const TIER_NAMES=["до 30 000 ₽","30 000–100 000 ₽","от 100 000 ₽"];
const byId=Object.fromEntries(CATALOG.map(p=>[p.id,p]));
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData!==undefined ? window.Telegram.WebApp : null;
let cart={}; // id -> boxes
let cat="all", query="";
try{cart=JSON.parse(localStorage.getItem("bosmos_cart")||"{}")||{}}catch(e){cart={}}
for(const k in cart) if(!byId[k]||!sellable(byId[k])) delete cart[k];
function save(){try{localStorage.setItem("bosmos_cart",JSON.stringify(cart))}catch(e){}}

function sellable(p){return p.prices && p.status!=="out"}
const rub=(v,d)=>v.toLocaleString("ru-RU",{minimumFractionDigits:d??(v<100&&v%1?2:0),maximumFractionDigits:d??(v<100?2:0)})+" ₽";

/* Pricing — same rules as bot/pricing.py
   Пластик (sell:"box") — коробками, остальное поштучно.
   Ступень (sum): по сумме заказа в базовых ценах ≥30 000 / ≥100 000 ₽ — скидка даётся, даже если после пересчёта сумма ниже порога.
   kg: сухие смеси и смеси для вафель — «от 10 кг» при 10+ пачках (по 1 кг) в заказе. fixed: одна цена. */
const isBox=p=>p.sell==="box";
const qty=(p,n)=>isBox(p)?`${n} кор`:`${n} шт`;
function quote(c){
  const lines=Object.entries(c).filter(([id,b])=>b>0&&byId[id]);
  const units=(p,n)=>isBox(p)?n*p.per_box:n;
  const kgPacks=lines.reduce((s,[id,n])=>byId[id].scheme==="kg"?s+units(byId[id],n):s,0);
  const kgIdx=kgPacks>=10?1:0;
  // ступень — по сумме заказа в базовых ценах (до скидки)
  const base=Math.round(lines.reduce((s,[id,n])=>s+units(byId[id],n)*byId[id].prices[0],0)*100)/100;
  let tier=0; for(let t=TIERS.length-1;t>0;t--){ if(base>=TIERS[t]){tier=t;break} }
  const unitPrice=p=>p.scheme==="sum"?p.prices[tier]:p.scheme==="kg"?p.prices[kgIdx]:p.prices[0];
  const rows=lines.map(([id,n])=>{const p=byId[id];const u=unitPrice(p);const k=units(p,n);return {p,boxes:n,units:k,unit:u,sum:Math.round(k*u*100)/100}});
  const total=Math.round(rows.reduce((s,r)=>s+r.sum,0)*100)/100;
  return {rows,total,base,tier,kgIdx,kgPacks,saving:Math.round((base-total)*100)/100,boxes:rows.reduce((s,r)=>s+r.boxes,0)};
}

function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(html!=null)e.innerHTML=html;return e}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderCats(){
  const nav=document.getElementById("cats");nav.innerHTML="";
  [["all","Все"],...CATS].forEach(([k,n])=>{
    if(k!=="all"&&!CATALOG.some(p=>p.cat===k))return;
    const b=el("button",{class:"cat",type:"button","aria-pressed":String(cat===k)},esc(n));
    b.onclick=()=>{cat=k;renderCats();renderList();window.scrollTo({top:0})};
    nav.appendChild(b);
  });
}

function renderTier(q){
  const box=document.getElementById("tier");
  const t=q.tier, next=TIERS[t+1];
  const pct=Math.min(100,q.base/TIERS[2]*100);
  let msg;
  if(!q.base) msg=`Цена зависит от суммы заказа. Добавьте товары — ступень пересчитается автоматически.`;
  else if(next) msg=`До цены <b>${TIER_NAMES[t+1]}</b> осталось <b>${rub(Math.max(0,next-q.base),0)}</b>`;
  else msg=`Действует лучшая цена: <b>от 100 000 ₽</b>`;
  box.innerHTML=`<div class="tier-row"><span>Ваша цена: <b>${TIER_NAMES[t]}</b></span><span>${msg}</span></div>
    <div class="track" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <div class="marks"><span>0</span><span>30 000</span><span>100 000 ₽</span></div>`;
}

function priceBlock(p,q){
  if(!p.prices) return `<div class="price"><strong>${p.status==="out"?"Нет в наличии":"Цена по запросу"}</strong></div>`;
  const per="шт";
  if(p.scheme==="sum"){
    const u=p.prices[q.tier]; const same=p.prices[0]===p.prices[2];
    return `<div class="price"><strong>${rub(u)}</strong> <span>/ ${per}</span></div>`+
      (same?"":`<div class="ladder">${p.prices.map((v,i)=>`<span class="${i===q.tier?"on":""}" title="${TIER_NAMES[i]}">${rub(v,0)}</span>`).join("")}</div>`);
  }
  if(p.scheme==="kg"){
    return `<div class="price"><strong>${rub(p.prices[q.kgIdx])}</strong> <span>/ кг</span></div>
      <div class="ladder"><span class="${q.kgIdx===0?"on":""}">${rub(p.prices[0],0)} до 10 кг</span><span class="${q.kgIdx===1?"on":""}">${rub(p.prices[1],0)} от 10 кг</span></div>`;
  }
  return `<div class="price"><strong>${rub(p.prices[0])}</strong> <span>/ шт</span></div>`;
}
function boxText(p){
  if(p.cat==="equipment") return p.box_dims?`Габариты: ${esc(p.box_dims)}`:"";
  const pack=p.cat==="cutlery"?" · 100 шт/уп":"";
  if(isBox(p)) return `Коробка: ${p.per_box.toLocaleString("ru-RU")} шт${pack}`;
  return `Поштучно · в коробке ${esc(p.box_desc||p.per_box+" шт")}`;
}
function qtyInput(p,n){return `<label class="qwrap"><input class="qin" type="number" inputmode="numeric" min="0" max="1000" step="1" data-set="${p.id}" value="${n}" aria-label="Количество, шт: ${esc(p.name)}"><span>шт</span></label>`}
function stepper(p){
  const n=cart[p.id]||0;
  if(!sellable(p)) return `<button class="add" type="button" disabled>${p.status==="out"?"Нет в наличии":"Уточнить у менеджера"}</button>`;
  if(!n) return `<button class="add" type="button" data-add="${p.id}">${isBox(p)?"+ коробка":"В корзину"}</button>`;
  const mid=isBox(p)?`<output>${n} кор · ${(n*p.per_box).toLocaleString("ru-RU")} шт</output>`:qtyInput(p,n);
  return `<div class="step"><button type="button" data-dec="${p.id}" aria-label="Меньше">−</button>${mid}<button type="button" data-inc="${p.id}" aria-label="Больше">+</button></div>`;
}
function card(p,q){
  const badges=[p.tag?`<span class="badge">${p.tag}</span>`:"",p.status==="order"?`<span class="badge order">${p.lead?"под заказ "+p.lead:"под заказ"}</span>`:"",p.status==="out"?`<span class="badge out">нет</span>`:""].join("");
  const img=p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:`<div class="ph-empty">${esc(p.name.replace(/^Вкус /,""))}</div>`;
  const c=el("article",{class:"card"});
  c.innerHTML=`<div class="ph">${img}<div class="badges">${badges}</div></div>
   <div class="body"><div class="name">${esc(p.name)}</div>${priceBlock(p,q)}
   <div class="meta">${boxText(p)}${p.country?" · "+esc(p.country):""}</div>
   <div class="act" id="act-${p.id}">${stepper(p)}</div></div>`;
  return c;
}
function brandingBlock(){
  return `<div class="brandcard"><b>Брендирование стаканов под заказ</b>
   <div style="overflow-x:auto"><table><tr><th>Объём</th><th>от 10 000 шт</th><th>от 20 000 шт</th></tr>
   <tr><td>360 мл</td><td>7,40 ₽</td><td>6,51 ₽</td></tr><tr><td>500 мл</td><td>8,40 ₽</td><td>7,35 ₽</td></tr>
   <tr><td>650 мл</td><td>9,50 / 10,10 ₽</td><td>8,82 / 9,35 ₽</td></tr></table></div>
   <div class="meta">Плоское / круглое дно. Минимальная партия одного вида — 10 000 шт, срок изготовления от 21 дня. Укажите в комментарии к заявке.</div></div>`;
}
function renderList(){
  const q=quote(cart);
  const list=document.getElementById("list");list.innerHTML="";
  const qq=query.trim().toLowerCase();
  let any=false;
  CATS.forEach(([k,n])=>{
    if(cat!=="all"&&cat!==k)return;
    const items=CATALOG.filter(p=>p.cat===k&&(!qq||p.name.toLowerCase().includes(qq)));
    if(!items.length)return; any=true;
    list.appendChild(el("h2",{class:"sec"},`${esc(n)} <span style="color:var(--muted);font-family:var(--f-body);font-size:13px">${items.length}</span>`));
    if(k==="lids") list.appendChild(el("p",{class:"note"},"Цветные крышки — только под заказ, поставка 3–5 рабочих дней. Другие цвета крышек с питейником 90 и 80 мм — под заказ от 3 000 шт."));
    if(k==="mixes") list.appendChild(el("p",{class:"note"},"Для коктейлей, бабл ти и мягкого мороженого. Пачка 1 кг. Цена «от 10 кг» — при заказе от 10 пачек любых вкусов вместе со смесями для вафель."));
    const g=el("div",{class:"grid"});items.forEach(p=>g.appendChild(card(p,q)));list.appendChild(g);
    if(k==="cups"&&!qq) list.insertAdjacentHTML("beforeend",brandingBlock());
  });
  if(!any) list.innerHTML=`<div class="empty">Ничего не нашлось по запросу «${esc(query)}»</div>`;
  renderTier(q);renderBar(q);
}
function renderBar(q){
  q=q||quote(cart);
  document.getElementById("barsum").innerHTML=q.boxes?`${q.rows.length} поз.<strong>${rub(q.total,0)}</strong>`:`Корзина пуста<strong>0 ₽</strong>`;
  document.getElementById("openCart").disabled=!q.boxes;
}
function change(id,d){
  cart[id]=Math.max(0,(cart[id]||0)+d); if(!cart[id]) delete cart[id]; save();
  const q=quote(cart);
  // refresh prices on all cards when tier may change; cheap enough for ~150 cards
  renderList();
  if(!document.getElementById("sheetBg").hidden) openCart();
  if(tg&&tg.HapticFeedback) try{tg.HapticFeedback.selectionChanged()}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-add],[data-inc],[data-dec]"); if(!t)return;
  const id=t.dataset.add||t.dataset.inc||t.dataset.dec;
  change(id,t.dataset.dec?-1:1);
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value;renderList()});
/* ручной ввод количества для поштучных товаров */
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-set]"); if(!t)return;
  const id=t.dataset.set; let v=Math.floor(Number(String(t.value).replace(",",".")));
  if(!isFinite(v)||v<0)v=0; v=Math.min(v,1000);
  change(id,v-(cart[id]||0));
});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest("[data-set]"); if(t&&e.key==="Enter"){e.preventDefault();t.blur()}});

/* Sheets */
const bg=document.getElementById("sheetBg"), sheet=document.getElementById("sheet");
function closeSheet(){bg.hidden=true;document.body.style.overflow=""}
bg.addEventListener("click",e=>{if(e.target===bg)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.getElementById("openCart").onclick=openCart;

function openCart(){
  const q=quote(cart);
  if(!q.boxes){closeSheet();return}
  bg.hidden=false;document.body.style.overflow="hidden";
  const next=TIERS[q.tier+1];
  sheet.innerHTML=`<h3 id="sheetTitle">Корзина<button class="x" type="button" aria-label="Закрыть">✕</button></h3>
   ${q.rows.map(r=>`<div class="line">${r.p.img?`<img src="${r.p.img}" alt="">`:`<div class="mini"></div>`}
     <div class="t"><b>${esc(r.p.name)}</b><span>${r.units.toLocaleString("ru-RU")} ${r.p.scheme==="kg"?"кг":"шт"} × ${rub(r.unit)}</span>${r.p.status==="order"?`<span style="display:block;color:var(--warn)">под заказ${r.p.lead?", "+r.p.lead:""}</span>`:""}</div>
     <div class="r">${rub(r.sum,0)}<div class="step"><button type="button" data-dec="${r.p.id}" aria-label="Меньше">−</button>${isBox(r.p)?`<output>${qty(r.p,r.boxes)}</output>`:qtyInput(r.p,r.boxes)}<button type="button" data-inc="${r.p.id}" aria-label="Больше">+</button></div></div></div>`).join("")}
   <div class="totals">
     <div><span>Сумма до скидки</span><b>${rub(q.base,0)}</b></div>
     <div><span>Ступень цены</span><b>${TIER_NAMES[q.tier]}</b></div>
     ${q.saving>0?`<div><span>Экономия к базовой цене</span><b style="color:var(--ok)">−${rub(q.saving,0)}</b></div>`:""}
     <div class="grand"><span>Итого</span><span>${rub(q.total,0)}</span></div>
     <div class="meta">НДС 22% включён</div>
   </div>
   ${next?`<p class="hint">Добавьте товаров ещё на ${rub(next-q.base,0)} — цены на ингредиенты снизятся до ступени «${TIER_NAMES[q.tier+1]}».</p>`:""}
   <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" type="button" id="clr">Очистить</button><button class="btn" type="button" id="toForm" style="flex:1">Оформить заявку</button></div>`;
  sheet.querySelector(".x").onclick=closeSheet;
  sheet.querySelector("#clr").onclick=()=>{cart={};save();closeSheet();renderList()};
  sheet.querySelector("#toForm").onclick=openForm;
}

let form={name:"",phone:"",buyer:"company",inn:"",delivery:"pickup",city:"",pay:"invoice",comment:""};
try{Object.assign(form,JSON.parse(localStorage.getItem("bosmos_form")||"{}"))}catch(e){}
if(DEMO&&!form.name){form=Object.assign(form,{name:"Анна, кофейня «Пример»",phone:"+7 900 000-00-00",inn:"7700000000",comment:"Пример заполнения для демонстрации"})}
function openForm(){
  const q=quote(cart);
  sheet.innerHTML=`<h3 id="sheetTitle">Заявка на счёт<button class="x" type="button" aria-label="Закрыть">✕</button></h3>
  <form id="f" novalidate>
    <label for="f-name">ФИО и название Вашей компании<input id="f-name" type="text" autocomplete="name" value="${esc(form.name)}" required></label>
    <label for="f-phone">Телефон<input id="f-phone" type="tel" autocomplete="tel" value="${esc(form.phone)}" placeholder="+7…" required></label>
    <div><div style="font-size:13px;font-weight:600;margin-bottom:5px">Покупатель</div><div class="seg">
      <label><input type="radio" name="buyer" id="b-co" value="company" ${form.buyer==="company"?"checked":""}>Юрлицо / ИП</label>
      <label><input type="radio" name="buyer" id="b-pe" value="person" ${form.buyer==="person"?"checked":""}>Физлицо</label></div></div>
    <label for="f-inn" id="innWrap" ${form.buyer==="person"?"hidden":""}>ИНН<input id="f-inn" type="text" inputmode="numeric" value="${esc(form.inn)}"></label>
    <div><div style="font-size:13px;font-weight:600;margin-bottom:5px">Получение</div><div class="seg">
      <label><input type="radio" name="delivery" id="d-pk" value="pickup" ${form.delivery==="pickup"?"checked":""}>Самовывоз, Каширский пр-д 17с10</label>
      <label><input type="radio" name="delivery" id="d-tk" value="tk" ${form.delivery==="tk"?"checked":""}>Транспортная компания</label></div></div>
    <label for="f-city" id="cityWrap" ${form.delivery==="tk"?"":"hidden"}>Город и ТК<input id="f-city" type="text" value="${esc(form.city)}" placeholder="Казань, СДЭК"></label>
    <div><div style="font-size:13px;font-weight:600;margin-bottom:5px">Оплата</div><div class="seg">
      <label><input type="radio" name="pay" id="p-inv" value="invoice" ${form.pay==="invoice"?"checked":""}>По счёту</label>
      <label id="cashWrap" ${form.delivery==="tk"?"hidden":""}><input type="radio" name="pay" id="p-cash" value="cash" ${form.pay==="cash"?"checked":""}>Наличными при получении</label></div>
      <p class="meta" id="tkPayNote" style="margin:6px 0 0" ${form.delivery==="tk"?"":"hidden"}>При доставке транспортной компанией — только оплата по счёту.</p></div>
    <label for="f-com">Комментарий<textarea id="f-com" placeholder="Сроки, брендирование, вопросы">${esc(form.comment)}</textarea></label>
    <div class="err" id="ferr" hidden></div>
    <div class="totals" style="padding-block:0"><div class="grand"><span>${q.rows.length} поз. на сумму</span><span>${rub(q.total,0)}</span></div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost" type="button" id="back">Назад</button><button class="btn" type="submit" style="flex:1">Отправить заявку</button></div>
  </form>`;
  sheet.querySelector(".x").onclick=closeSheet;
  sheet.querySelector("#back").onclick=openCart;
  const f=sheet.querySelector("#f");
  const sync=()=>{
    if(form.delivery==="tk"&&form.pay==="cash"){form.pay="invoice";f.querySelector("#p-inv").checked=true}
    f.querySelector("#innWrap").hidden=form.buyer==="person";
    f.querySelector("#cityWrap").hidden=form.delivery!=="tk";
    f.querySelector("#cashWrap").hidden=form.delivery==="tk";
    f.querySelector("#tkPayNote").hidden=form.delivery!=="tk";
  };
  f.addEventListener("change",()=>{readForm(f);sync()});
  f.addEventListener("submit",e=>{e.preventDefault();submit(f)});
}
function readForm(f){
  form.name=f.querySelector("#f-name").value.trim();form.phone=f.querySelector("#f-phone").value.trim();
  form.buyer=f.querySelector("[name=buyer]:checked").value;form.inn=f.querySelector("#f-inn").value.trim();
  form.delivery=f.querySelector("[name=delivery]:checked").value;form.city=f.querySelector("#f-city").value.trim();
  form.pay=f.querySelector("[name=pay]:checked").value;form.comment=f.querySelector("#f-com").value.trim();
  try{localStorage.setItem("bosmos_form",JSON.stringify(form))}catch(e){}
}
function orderText(q){
  const L=[`Новая заявка из бота BOSMOS`,``,`${form.name}`,`Тел.: ${form.phone}`,
    form.buyer==="company"?`Юрлицо/ИП, ИНН ${form.inn||"—"}`:`Физлицо`,
    form.delivery==="pickup"?`Самовывоз, Каширский пр-д 17с10`:`ТК: ${form.city||"город не указан"}`,
    form.pay==="invoice"?`Оплата по счёту`:`Наличными при получении`,``];
  q.rows.forEach((r,i)=>L.push(`${i+1}. ${r.p.name} — ${isBox(r.p)?`${r.boxes} кор. (${r.units.toLocaleString("ru-RU")} шт)`:`${r.boxes} шт`} × ${rub(r.unit)} = ${rub(r.sum,0)}${r.p.status==="order"?` — под заказ${r.p.lead?", "+r.p.lead:""}`:""}`));
  L.push(``,`Ступень: ${TIER_NAMES[q.tier]}`,`Итого: ${rub(q.total,0)} (НДС 22% включён)`);
  if(form.comment)L.push(``,`Комментарий: ${form.comment}`);
  return L.join("\n");
}
function submit(f){
  readForm(f);
  const err=f.querySelector("#ferr");
  const digits=form.phone.replace(/\D/g,"");
  let m="";
  if(!form.name)m="Укажите ФИО и название компании.";
  else if(digits.length<10)m="Проверьте телефон: нужно не меньше 10 цифр.";
  else if(form.buyer==="company"&&!/^\d{10}(\d{2})?$/.test(form.inn))m="ИНН — 10 цифр для юрлица или 12 для ИП.";
  else if(form.delivery==="tk"&&!form.city)m="Укажите город и транспортную компанию.";
  err.hidden=!m;err.textContent=m;if(m)return;
  if(form.delivery==="tk")form.pay="invoice";
  const q=quote(cart);
  const payload={v:1,items:q.rows.map(r=>[r.p.id,r.boxes]),f:form,total:q.total};
  if(tg){ try{ tg.sendData(JSON.stringify(payload)); return }catch(e){ err.hidden=false; err.textContent="Не удалось отправить заявку. Откройте каталог кнопкой «Открыть каталог» под полем ввода в чате с ботом."; return } }
  sheet.innerHTML=`<h3 id="sheetTitle">Заявка сформирована<button class="x" type="button" aria-label="Закрыть">✕</button></h3>
   <p class="note" style="margin:0 0 10px">В Telegram это сообщение придёт менеджеру, а покупатель получит подтверждение в чате с ботом.</p>
   <div class="preview">${esc(orderText(q))}</div>
   <p class="demo">Демо-режим: в браузере заявка никуда не отправляется.</p>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" type="button" id="again">К каталогу</button><button class="btn" type="button" id="newo" style="flex:1">Новая заявка</button></div>`;
  sheet.querySelector(".x").onclick=closeSheet;
  sheet.querySelector("#again").onclick=closeSheet;
  sheet.querySelector("#newo").onclick=()=>{cart={};save();closeSheet();renderList()};
}

/* Telegram theme */
if(tg){
  try{tg.ready();tg.expand();
    const tp=tg.themeParams||{};const r=document.documentElement;
    r.setAttribute("data-theme",tg.colorScheme==="dark"?"dark":"light");
    if(tp.bg_color)r.style.setProperty("--surface",tp.bg_color);
    if(tp.secondary_bg_color)r.style.setProperty("--bg",tp.secondary_bg_color);
    if(tp.text_color)r.style.setProperty("--fg",tp.text_color);
    if(tp.hint_color)r.style.setProperty("--muted",tp.hint_color);
  }catch(e){}
}
/* Demo: open with a realistic sample cart so the first view shows the pricing at work */
if(DEMO&&!Object.keys(cart).length){cart={p003:2,p018:1,p057:10,p062:6,p061:4,p021:1}}
renderCats();renderList();
</script>

</body></html>
